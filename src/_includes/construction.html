<style>
  .construction-notice {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 50px;
    background-color: #fdfdfd;
    color: #444;
  }

  .construction-notice h1 {
    font-size: 1.5em;
    margin: 0 0 20px;
  }

  .construction-notice p {
    font-size: 1.2em;
    color: #666;
  }

  .construction-notice .illustration {
    display: block;
    width: 100%;
    max-width: 225px;
    height: auto;
    margin: 30px auto 0;
  }

  .construction-link {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 15px;
    min-width: 150px;
    color: #0073e6;
    text-decoration: none;
    border: 1px solid #0073e6;
    border-radius: 5px;
    text-align: center;
  }

  .construction-link:hover {
    background-color: #0073e6;
    color: white;
  }

  @media (max-width: 600px) {
    .construction-notice h1 {
      font-size: 1.45em;
    }

    .construction-notice .illustration {
      max-width: 250px;
    }
  }
</style>

<section class="construction-notice" aria-labelledby="construction-heading">
  <img
    src="/assets/images/construction-eye.png"
    alt="A claymation computer monitor with a large eyeball and magnifying glass"
    class="illustration"
  >

  <h1 id="construction-heading">
    Hmm—this page seems to be going through something...
  </h1>

  <p><em>Check back later to see how it's feeling.</em></p>

  <a href="/" class="construction-link" id="return-link">
    Return to About
    (<span id="return-seconds">10</span>)
  </a>
</section>

<script>
  (() => {
    const secondsDisplay = document.getElementById("return-seconds");
    let seconds = 10;

    if (!secondsDisplay) {
      return;
    }

    const tick = () => {
      seconds -= 1;

      if (seconds <= 0) {
        window.location.href = "/";
        return;
      }

      secondsDisplay.textContent = seconds;
      window.setTimeout(tick, 1000);
    };

    window.setTimeout(tick, 1000);
  })();
</script>
